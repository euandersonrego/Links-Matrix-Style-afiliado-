<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | @euandersonrego</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Space Mono (Estilo Tech/Matrix) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matrix: {
                            bg: '#000000',
                            text: '#00ff41',
                            dim: '#008F11',
                            dark: '#0d0208'
                        }
                    },
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'neon': '0 0 5px theme("colors.matrix.text"), 0 0 20px theme("colors.matrix.dim")',
                        'neon-box': '0 0 2px theme("colors.matrix.text"), inset 0 0 2px theme("colors.matrix.text")'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Space Mono', monospace;
            overflow: hidden; /* Evita rolagem na página inteira, foca no "celular" */
        }

        /* Efeito de CRT / Scanline (linhas de TV antiga) */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Custom Scrollbar (Estilo Hacker) */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #001100;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 2px;
        }

        /* Animação de digitação simples */
        .typing-effect {
            border-right: 2px solid #00ff41;
            white-space: nowrap;
            overflow: hidden;
            animation: blink 0.75s step-end infinite;
        }
        
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #00ff41 }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="scanlines"></div>

    <!-- Moldura do "Celular" -->
    <main class="relative z-20 w-full max-w-sm h-[80vh] bg-black border-2 border-matrix-dim rounded-[2rem] shadow-neon flex flex-col overflow-hidden">
        
        <!-- Barra de Status Fictícia -->
        <div class="px-6 py-3 flex justify-between items-center text-xs text-matrix-dim border-b border-matrix-dim/30">
            <span>SYS.ON</span>
            <div class="flex gap-2">
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery" class="w-3 h-3"></i>
            </div>
        </div>

        <!-- Conteúdo Rolável -->
        <div class="flex-1 overflow-y-auto custom-scroll p-6 flex flex-col items-center justify-center">
            
            <!-- Header (Sem Imagem) -->
            <div class="text-center mb-8 w-full">
                <h1 class="text-xl font-bold tracking-tighter mb-1">@euandersonrego</h1>
                <!-- Texto alterado conforme pedido -->
                <p class="text-xs text-matrix-dim uppercase tracking-widest border-t border-b border-matrix-dim py-1 mt-2 inline-block">
                    TODOS OS LINKS DOS PRODUTOS
                </p>
                <div class="block mt-4 text-center">
                    <div class="text-sm opacity-90 typing-effect inline-block max-w-full">
                        > Carregando oportunidades...
                    </div>
                </div>
            </div>

            <!-- Lista de Links -->
            <div class="w-full space-y-4 pb-10">

                <!-- Link 1: Camiseta Dragon Ball -->
                <a href="https://vt.tiktok.com/ZS9JFg9Ck5Wed-Xq6VS/" target="_blank" class="block w-full group relative">
                    <!-- Fundo do botão -->
                    <div class="absolute inset-0 bg-matrix-text/10 translate-x-1 translate-y-1 rounded border border-matrix-dim transition-transform group-hover:translate-x-0 group-hover:translate-y-0"></div>
                    
                    <!-- Botão Principal -->
                    <div class="relative bg-black border border-matrix-text p-4 rounded flex items-center justify-between hover:bg-matrix-text/5 transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="text-matrix-text">>></span>
                            <div class="text-left">
                                <span class="font-bold text-sm block tracking-wide">CAMISETA GOKU (MESTRE KAME)</span>
                                <span class="text-[10px] text-matrix-dim">100% Algodão • Frete Grátis</span>
                            </div>
                        </div>
                        <!-- Ícone de Camiseta -->
                        <i data-lucide="shirt" class="w-4 h-4 text-matrix-text opacity-50 group-hover:opacity-100"></i>
                    </div>
                </a>

                <!-- Espaço para adicionar mais links -->
                <!-- Pode mandar o próximo print que eu adiciono aqui abaixo -->

            </div>
        </div>

        <!-- Footer Fixo do "App" -->
        <div class="p-4 bg-black border-t border-matrix-dim/30 text-center">
            <p class="text-[10px] opacity-50">2026</p>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
