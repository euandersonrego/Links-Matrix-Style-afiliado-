<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | @euandersonrego</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Space Mono (Estilo Tech/Matrix) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matrix: {
                            bg: '#000000',
                            text: '#00ff41',
                            dim: '#008F11',
                            dark: '#0d0208',
                            highlight: '#ccffcc'
                        }
                    },
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'neon': '0 0 5px theme("colors.matrix.text"), 0 0 20px theme("colors.matrix.dim")',
                        'glow': '0 0 10px rgba(0, 255, 65, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
        }

        /* Scanlines mais sutis para não atrapalhar a leitura */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 3px;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* Botão Tech Pro */
        .tech-btn {
            position: relative;
            background: rgba(0, 20, 0, 0.6);
            border: 1px solid #005500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        /* Efeito de Hover Avançado */
        .tech-btn:hover {
            background: rgba(0, 255, 65, 0.1);
            border-color: #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            transform: translateY(-2px);
        }

        /* Detalhe decorativo no canto do botão */
        .tech-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 10px 10px;
            border-color: transparent transparent #008F11 transparent;
            transition: border-color 0.3s;
        }
        .tech-btn:hover::after {
            border-color: transparent transparent #00ff41 transparent;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #000;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #008F11;
            border-radius: 2px;
        }

        .typing-effect {
            border-right: 2px solid #00ff41;
            white-space: nowrap;
            overflow: hidden;
            animation: blink 0.75s step-end infinite;
        }
        
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #00ff41 }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-black">

    <div class="scanlines"></div>

    <!-- Moldura do "Celular" -->
    <main class="relative z-20 w-full max-w-sm h-[85vh] bg-black border border-matrix-dim/50 rounded-[2rem] shadow-neon flex flex-col overflow-hidden ring-1 ring-matrix-text/20">
        
        <!-- Barra Superior (Status) -->
        <div class="px-6 py-4 flex justify-between items-center text-[10px] text-matrix-dim border-b border-matrix-dim/20 bg-matrix-text/5 backdrop-blur-sm">
            <span class="tracking-widest">SYS.ONLINE</span>
            <div class="flex gap-3">
                <i data-lucide="shield-check" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
            </div>
        </div>

        <!-- Conteúdo -->
        <div class="flex-1 overflow-y-auto custom-scroll p-6 flex flex-col">
            
            <!-- Header Minimalista -->
            <div class="text-center mb-8 mt-2">
                <h1 class="text-2xl font-bold tracking-tighter text-matrix-text mb-2">@euandersonrego</h1>
                <div class="h-px w-16 bg-matrix-dim mx-auto mb-3"></div>
                <div class="inline-flex items-center gap-2 text-xs text-matrix-dim border border-matrix-dim/30 px-3 py-1 rounded-full bg-matrix-text/5">
                    <span class="w-1.5 h-1.5 rounded-full bg-matrix-text animate-pulse"></span>
                    TODOS OS LINKS DOS PRODUTOS
                </div>
                
                <div class="mt-6 text-xs text-matrix-dim/70 typing-effect inline-block">
                    > Acesso aos itens selecionados_
                </div>
            </div>

            <!-- Lista de Links -->
            <div class="w-full space-y-4 pb-10">

                <!-- Link 1: Camiseta Dragon Ball -->
                <a href="https://vt.tiktok.com/ZS9JFg9Ck5Wed-Xq6VS/" target="_blank" class="tech-btn group block w-full rounded-lg p-4 cursor-pointer">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <!-- Ícone com brilho sutil -->
                            <div class="p-2 rounded bg-matrix-dim/10 group-hover:bg-matrix-text/20 transition-colors">
                                <i data-lucide="shirt" class="w-5 h-5 text-matrix-text"></i>
                            </div>
                            
                            <div class="text-left">
                                <span class="font-bold text-sm block tracking-wide text-matrix-text group-hover:text-white transition-colors">CAMISETA GOKU (MESTRE KAME)</span>
                                <span class="text-[10px] text-matrix-dim uppercase tracking-wider mt-0.5 block group-hover:text-matrix-highlight transition-colors">100% Algodão • Frete Grátis</span>
                            </div>
                        </div>
                        
                        <i data-lucide="chevron-right" class="w-4 h-4 text-matrix-dim group-hover:text-matrix-text group-hover:translate-x-1 transition-all"></i>
                    </div>
                </a>

                <!-- Espaço para adicionar mais links -->
                <!-- Copie e cole o bloco 'a' acima aqui -->

            </div>
        </div>

        <!-- Footer Discreto -->
        <div class="py-3 bg-black border-t border-matrix-dim/20 text-center">
            <p class="text-[9px] text-matrix-dim/40 tracking-[0.2em]">SECURE SYSTEM // 2026</p>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
